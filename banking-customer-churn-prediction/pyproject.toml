[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking_customer_churn_prediction"
version = "1.0.0"
description = "Production-ready churn prediction pipeline for banking customers"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "kedro~=0.18.0",
    "kedro-mlflow~=0.11.0",
    "kedro-datasets>=2.1.0",
    "pandas==2.0.3",
    "numpy==1.25.2",
    "scikit-learn==1.2.2",
    "mlflow==2.9.2",
    "joblib==1.3.2",
    "shap==0.42.1",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "boto3>=1.28.0",
    "pyarrow>=12.0.0",
    "plotly>=5.15.0",
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "prometheus-client>=0.17.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "structlog>=23.1.0",
    "great-expectations>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0",
    "ipywidgets>=8.0.0",
    "nbconvert>=7.4.0",
]
monitoring = [
    "grafana-api>=1.0.3",
    "elasticsearch>=8.9.0",
    "sentry-sdk>=1.30.0",
]
mlops = [
    "kfp>=2.0.0",
    "kfp-kubernetes>=1.0.0",
    "kfp-tekton>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/banking-customer-churn"
Documentation = "https://your-org.github.io/banking-customer-churn/"
Repository = "https://github.com/your-org/banking-customer-churn"
Issues = "https://github.com/your-org/banking-customer-churn/issues"

[tool.kedro]
package_name = "banking_customer_churn_prediction"
project_name = "Banking Customer Churn Prediction"
kedro_init_version = "1.0.0"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]

[project.scripts]
churn-api = "banking_customer_churn_prediction.api.main:run_api"
churn-train = "banking_customer_churn_prediction.__main__:main"
churn-monitor = "banking_customer_churn_prediction.monitoring.dashboard:main"
[tool.kedro_telemetry]
project_id = "751bd27284c040ef9b82e6eb0bda72de"